<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050b16" />
    <meta
      name="description"
      content="NEO AETHER — 悬浮于云海之上的未来科技都市，环岛磁浮列车穿过霓虹天际线。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Neo Aether · 环岛磁浮都市</title>
  </head>
  <body>
    <canvas id="scene" aria-label="未来浮空都市三维场景，可拖动环视、滚轮缩放"></canvas>

    <div class="fx-layer" aria-hidden="true"></div>

    <header class="brand">
      <span class="brand-mark">◈</span>
      <span class="brand-line"></span>
      <span>Aether City <i>//</i> Neo-07</span>
    </header>

    <aside class="hud" aria-label="环岛磁浮列车状态">
      <div class="hud-head">
        <span class="hud-dot" aria-hidden="true"></span>
        <span>Maglev Loop 01</span>
        <span class="hud-code">LIVE</span>
      </div>
      <div class="hud-grid">
        <div class="hud-cell">
          <span>Status</span>
          <strong>In Transit</strong>
        </div>
        <div class="hud-cell">
          <span>Velocity</span>
          <strong id="speed-value">000 KM/H</strong>
        </div>
      </div>
      <div class="hud-bar"><i id="loop-progress"></i></div>
      <div class="hud-foot">
        <span>Orbit 6.5 KM</span>
        <span>06 Cars</span>
      </div>
    </aside>

    <main class="hero">
      <p class="eyebrow">Floating Metropolis · Sector 07</p>
      <h1>Neo <em>Aether</em></h1>
      <p class="cn">环 岛 磁 浮 都 市</p>
      <p class="desc">悬浮于云海之上的未来城邦，环岛磁浮列车永不停歇。</p>
    </main>

    <div class="hint" id="hint" aria-hidden="true">
      <span class="mouse"></span>
      <span>拖动环视 · 滚轮缩放</span>
    </div>

    <nav class="controls" aria-label="场景控制">
      <button class="ui-btn" id="rotate-toggle" type="button" aria-pressed="true">
        <span class="ui-dot" aria-hidden="true"></span>
        自动巡航
      </button>
      <button class="ui-btn" id="reset-view" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M4 9V5a1 1 0 0 1 1-1h4M20 15v4a1 1 0 0 1-1 1h-4M15 4h4a1 1 0 0 1 1 1v4M9 20H5a1 1 0 0 1-1-1v-4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
          />
        </svg>
        重置视角
      </button>
    </nav>

    <div id="loader">
      <div class="loader-inner">
        <div class="loader-emblem" aria-hidden="true">
          <span></span>
          <i>◈</i>
        </div>
        <p class="loader-en">Initializing Neo Aether</p>
        <p class="loader-cn">正在接入环岛都市</p>
        <div class="loader-bar"><i></i></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
